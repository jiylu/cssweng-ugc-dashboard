services:
  backend:
    platform: linux/amd64 
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: asceoft-backend
    volumes:
      - ./backend:/app
      - /app/node_modules 
    env_file:
      - ./backend/.env

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: asceoft-frontend
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next 
    env_file:
      - ./frontend/.env
    environment:
      - INTERNAL_API_URL=http://backend:8080
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend
