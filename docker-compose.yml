services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: asceoft-backend
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
      - /app/node_modules 
    env_file:
      - ./backend/.env

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: asceoft-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next 
    env_file:
      - ./frontend/.env
    depends_on:
      - backend